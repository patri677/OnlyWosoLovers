name: 人物/关系资料建议
description: 不熟悉编辑 JSON？在这里提交新增或更正建议，交由管理员审核。
title: "[资料建议] "
body:
  - type: markdown
    attributes:
      value: |
        此表单只提交待审核建议，不会自动更改网站。请附上可公开查看的来源链接；不要填写密码、令牌或私人信息。
  - type: textarea
    id: change
    attributes:
      label: 想新增或更正什么？
      description: 请写明人物姓名，以及需要新增/修改的人物信息或关系。
      placeholder: 例如：为某球员补充现效力俱乐部；补充 A 与 B 的关系。
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: 信息来源
      description: 粘贴支持此修改的公开链接，并说明来源中的相关内容。
    validations:
      required: true
  - type: textarea
    id: data-file
    attributes:
      label: 可选：附上导出的 JSON 文件
      description: 若已在网页中修改，请点击“导出数据”保存 JSON，再创建 Issue 并上传附件；如格式不被接受，可压缩为 ZIP。请说明基于哪个版本、具体修改了什么，附件不会自动覆盖正式数据。
    validations:
      required: false
